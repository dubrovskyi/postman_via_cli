name: newman

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    # Nightly smoke run at 03:00 UTC
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      collection:
        description: 'Path in the repo, or a public URL, of the collection to run'
        required: true
        default: 'collections/postman-echo.postman_collection.json'
      environment:
        description: 'Path of the environment file (leave empty to run without one)'
        required: false
        default: 'environments/postman-echo.postman_environment.json'
      bail:
        description: 'Stop on the first failure'
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  # A manual run targets one collection; every other trigger runs them all.
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - id: set
        env:
          MANUAL: ${{ github.event_name == 'workflow_dispatch' }}
          COLLECTION: ${{ inputs.collection }}
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          if [ "$MANUAL" = "true" ]; then
            matrix=$(jq -cn --arg c "$COLLECTION" --arg e "$ENVIRONMENT" \
              '{include:[{name:"manual",collection:$c,environment:$e}]}')
          else
            matrix=$(jq -cn '{include:[
              {name:"postman-echo",
               collection:"collections/postman-echo.postman_collection.json",
               environment:"environments/postman-echo.postman_environment.json"},
              {name:"jsonplaceholder",
               collection:"collections/jsonplaceholder.postman_collection.json",
               environment:"environments/jsonplaceholder.postman_environment.json"}
            ]}')
          fi
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  run:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ${{ matrix.name }}
        # Values are passed through the environment rather than interpolated
        # into the script, so a crafted input cannot inject shell commands.
        env:
          COLLECTION: ${{ matrix.collection }}
          ENVIRONMENT: ${{ matrix.environment }}
          BAIL: ${{ inputs.bail }}
        run: |
          args=(--collection "$COLLECTION" --reporters cli,htmlextra,allure,junit)
          if [ -n "$ENVIRONMENT" ]; then
            args+=(--environment "$ENVIRONMENT")
          fi
          if [ "$BAIL" = "true" ]; then
            args+=(--bail)
          fi
          node start.js "${args[@]}"

      - name: Generate Allure report
        # always() so the report is produced for failing runs too - that is
        # exactly when it is worth looking at.
        if: always()
        run: npm run allure:generate

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newman-${{ matrix.name }}-${{ github.run_number }}
          path: |
            reports/htmlResults.html
            reports/junitResults.xml
            reports/allure-report
          retention-days: 30

      - name: Publish results to the run summary
        if: always()
        uses: mikepenz/action-junit-report@v6
        with:
          report_paths: reports/junitResults.xml
          check_name: newman results (${{ matrix.name }})
          fail_on_failure: false
          require_tests: true
